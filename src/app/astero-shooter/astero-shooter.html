<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astero Shooter | Vyshakh Vengilode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Anek+Malayalam:wght@500&display=swap');
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; cursor: crosshair; }
        
        #branding {
            position: absolute; top: 15px; width: 100%; text-align: center;
            pointer-events: none; z-index: 20;
        }
        #branding h1 { color: #fff; margin: 0; font-size: 38px; letter-spacing: 6px; text-shadow: 0 0 20px #00d2ff; }
        #branding p { 
    color: #00d2ff; 
    margin: 5px 0 0; 
    font-size: 16px; /* Increased slightly for better readability */
    font-family: 'Anek Malayalam', sans-serif; 
    font-weight: 500; /* Medium weight */
    letter-spacing: 1px; 
    opacity: 0.9; 
}

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .stats { position: absolute; top: 20px; left: 20px; color: #fff; }
        #score-val { font-size: 28px; color: #ffd700; }
        
        #combo-ui { font-size: 20px; color: #ff00ff; margin-top: 10px; opacity: 0; transition: 0.2s; text-shadow: 0 0 10px #ff00ff; }

        .lives-box { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; }
        .life { width: 20px; height: 20px; background: #ff4444; clip-path: polygon(50% 0%, 100% 100%, 0% 100%); transition: 0.3s; }

        #game-over-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white;
        }
        #game-over-screen h2 { color: #ff4444; font-size: 60px; margin: 0; text-shadow: 0 0 30px #ff0000; }
        
        .leaderboard { margin: 20px 0; width: 300px; border-top: 1px solid #444; padding-top: 15px; }
        .leaderboard-row { display: flex; justify-content: space-between; margin: 5px 0; font-size: 14px; color: #aaa; }

        #name-input-area { margin-top: 15px; text-align: center; }
        #player-name { background: transparent; border: 1px solid #00d2ff; color: white; padding: 10px; font-family: 'Orbitron'; text-align: center; outline: none; }
        
        #restart-hint { margin-top: 20px; font-size: 14px; color: #00d2ff; animation: blink 1s infinite; pointer-events: none; }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="branding">
        <h1>ASTERO SHOOTER</h1>
        <p>Developed by Vyshakh Vengilode</p>
    </div>

    <div id="ui-layer">
        <div class="stats">
            <div id="score-val">00000</div>
            <div id="lvl-txt">LEVEL 1</div>
            <div id="combo-ui">COMBO X1</div>
        </div>
        <div class="lives-box" id="lives-box">
            <div class="life" id="l1"></div><div class="life" id="l2"></div><div class="life" id="l3"></div>
        </div>
    </div>

    <div id="game-over-screen">
        <h2>MISSION FAILED</h2>
        <div id="name-input-area">
            <p>NEW RECORD! ENTER PILOT NAME:</p>
            <input type="text" id="player-name" maxlength="10" placeholder="NAME">
            <button onclick="saveHighScore()" style="background: #00d2ff; border: none; padding: 10px 20px; font-family: 'Orbitron'; cursor: pointer; margin-top: 10px;">SAVE</button>
        </div>
        <div class="leaderboard" id="leaderboard-list"></div>
        <p id="restart-hint">PRESS ENTER TO RESTART MISSION</p>
    </div>

    <script>
        const CONFIG = { 
            baseSpeed: 0.6, 
            bulletSpeed: 2.5, 
            spawnRate: 0.08, 
            comboExpiry: 1500,
            starCount: 3000 // Increased density for depth
        };

        let state = {
            score: 0, level: 1, lives: 3, active: true,
            mouse: new THREE.Vector2(), speedMult: 1, powerup: 0,
            combo: 0, lastHitTime: 0, keys: {}
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x4444ff, 0.4));
        const sun = new THREE.PointLight(0xffffff, 1.5);
        sun.position.set(5, 15, 10);
        scene.add(sun);

        // --- ENHANCED CONTINUOUS STARFIELD ---
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(CONFIG.starCount * 3);
        for(let i=0; i < CONFIG.starCount * 3; i+=3) {
            starPos[i] = (Math.random() - 0.5) * 200;     // Wider span
            starPos[i+1] = (Math.random() - 0.5) * 200;   // Higher span
            starPos[i+2] = Math.random() * -500;          // Distributed deep into Z
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.3 }); // Lower opacity
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // Ship
        const ship = new THREE.Group();
        const shipMat = new THREE.MeshStandardMaterial({color: 0x00d2ff, metalness: 0.8, roughness: 0.2});
        const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.4, 2.5, 8), shipMat);
        fuselage.rotation.x = Math.PI/2;
        const wingGeo = new THREE.BoxGeometry(2.5, 0.1, 0.8);
        const wings = new THREE.Mesh(wingGeo, shipMat);
        wings.position.z = 0.3;
        const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshStandardMaterial({color: 0xffffff, transparent: true, opacity: 0.6}));
        cockpit.position.y = 0.2; cockpit.position.z = -0.2; cockpit.scale.set(1, 0.6, 1.5);
        ship.add(fuselage, wings, cockpit);
        scene.add(ship);

        const asteroids = [], bullets = [], diamonds = [], particles = [];

        // Sound Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, dur, vol=0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        // Leaderboard
        function getLeaderboard() { return JSON.parse(localStorage.getItem('astero_leaderboard')) || []; }
        function showLeaderboard() {
            const lb = getLeaderboard();
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '<div class="leaderboard-row" style="color:#00d2ff"><span>PILOT</span><span>SCORE</span></div>';
            lb.slice(0, 5).forEach(entry => {
                listEl.innerHTML += `<div class="leaderboard-row"><span>${entry.name}</span><span>${entry.score}</span></div>`;
            });
            const isHighScore = lb.length < 5 || state.score > lb[lb.length-1].score;
            document.getElementById('name-input-area').style.display = isHighScore ? 'block' : 'none';
        }
        window.saveHighScore = function() {
            const name = document.getElementById('player-name').value || 'PILOT';
            let lb = getLeaderboard();
            lb.push({ name: name.toUpperCase(), score: state.score });
            lb.sort((a, b) => b.score - a.score);
            localStorage.setItem('astero_leaderboard', JSON.stringify(lb.slice(0, 10)));
            document.getElementById('name-input-area').style.display = 'none';
            showLeaderboard();
        };

        function triggerCombo() {
            const now = Date.now();
            if (now - state.lastHitTime < CONFIG.comboExpiry) state.combo++;
            else state.combo = 1;
            state.lastHitTime = now;
            const comboEl = document.getElementById('combo-ui');
            comboEl.innerText = `COMBO X${state.combo}`;
            comboEl.style.opacity = state.combo > 1 ? 1 : 0;
        }

        function spawnExplosion(pos, color, count=10) {
            for(let i=0; i<count; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({color: color}));
                p.position.copy(pos);
                p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*0.6, (Math.random()-0.5)*0.6, (Math.random()-0.5)*0.6), life: 1.0 };
                scene.add(p);
                particles.push(p);
            }
            playSound(120, 'sawtooth', 0.2);
        }

        function spawnDiamond() {
            const geo = new THREE.OctahedronGeometry(0.6, 0);
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x00ffff, metalness: 1}));
            mesh.position.set((Math.random()-0.5)*35, (Math.random()-0.5)*22, -100);
            scene.add(mesh);
            diamonds.push(mesh);
        }

        function fire() {
            if(!state.active) return;
            const createBullet = (offsetX) => {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.18), new THREE.MeshBasicMaterial({color: 0xff3300}));
                b.position.copy(ship.position);
                b.position.x += offsetX;
                scene.add(b);
                bullets.push(b);
            };
            if(state.powerup > 0) { createBullet(-0.6); createBullet(0.6); } 
            else createBullet(0);
            playSound(500, 'sine', 0.1, 0.05);
        }

        window.addEventListener('mousemove', e => {
            state.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            state.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        window.addEventListener('mousedown', fire);
        window.addEventListener('keydown', e => {
            state.keys[e.code] = true;
            if(e.code === 'Enter' && !state.active) location.reload();
        });
        window.addEventListener('keyup', e => state.keys[e.code] = false);

        function update() {
            if (!state.active) return;

            // Movement
            ship.position.lerp(new THREE.Vector3(state.mouse.x * 22, state.mouse.y * 14, 0), 0.1);
            ship.rotation.z = (ship.position.x - (state.mouse.x * 22)) * 0.08;
            ship.rotation.x = ((state.mouse.y * 14) - ship.position.y) * 0.05;

            // Level Speed Multipliers
            if(state.level >= 30) state.speedMult = 4.5;
            else if(state.level >= 20) state.speedMult = 4;
            else if(state.level >= 10) state.speedMult = 2;
            else state.speedMult = 1;

            let currentSpeed = CONFIG.baseSpeed * state.speedMult;
            if(state.keys['ShiftLeft'] && state.keys['ArrowDown']) currentSpeed = 0.1;

            // --- SMOOTH INFINITE STAR ANIMATION ---
            const starPositions = starField.geometry.attributes.position.array;
            for (let i = 0; i < CONFIG.starCount; i++) {
                let zIdx = i * 3 + 2;
                starPositions[zIdx] += currentSpeed * 3; // Parallax
                if (starPositions[zIdx] > 15) {
                    starPositions[zIdx] = -485; // Reset to back of tunnel
                    // Randomize X and Y again to break up "patterns"
                    starPositions[zIdx-1] = (Math.random() - 0.5) * 200;
                    starPositions[zIdx-2] = (Math.random() - 0.5) * 200;
                }
            }
            starField.geometry.attributes.position.needsUpdate = true;

            // Combos
            if (Date.now() - state.lastHitTime > CONFIG.comboExpiry) {
                state.combo = 0; document.getElementById('combo-ui').style.opacity = 0;
            }

            if(state.powerup > 0) state.powerup -= 0.016;

            // Spawning Asteroids
            if(Math.random() < CONFIG.spawnRate) {
                const isGold = Math.random() < 0.12;
                const size = 0.8 + Math.random() * 1.7;
                const mesh = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(size), 
                    new THREE.MeshStandardMaterial({color: isGold ? 0xffd700 : 0x777777, flatShading: true})
                );
                mesh.position.set((Math.random()-0.5)*45, (Math.random()-0.5)*30, -100);
                mesh.userData = { type: isGold ? 'gold' : 'std', radius: size };
                scene.add(mesh);
                asteroids.push(mesh);
            }
            if(Math.random() < 0.006) spawnDiamond();

            // Projectiles
            bullets.forEach((b, i) => {
                b.position.z -= CONFIG.bulletSpeed;
                if(b.position.z < -110) { scene.remove(b); bullets.splice(i,1); }
            });

            diamonds.forEach((d, i) => {
                d.position.z += currentSpeed;
                if(d.position.distanceTo(ship.position) < 1.8) {
                    state.powerup = 10; state.score += 200;
                    document.getElementById('score-val').innerText = state.score.toString().padStart(5, '0');
                    spawnExplosion(d.position, 0x00ffff, 15);
                    scene.remove(d); diamonds.splice(i,1);
                    playSound(900, 'sine', 0.4);
                }
            });

            asteroids.forEach((a, i) => {
                a.position.z += currentSpeed;
                const dist = a.position.distanceTo(ship.position);
                if(dist < (a.userData.radius + 0.5)) {
                    if(a.userData.type === 'gold') {
                        state.score += 500; triggerCombo();
                        spawnExplosion(a.position, 0xffd700, 20);
                        scene.remove(a); asteroids.splice(i,1);
                    } else {
                        state.lives--;
                        const lifeEl = document.getElementById(`l${3-state.lives}`);
                        if(lifeEl) lifeEl.style.opacity = '0.1';
                        spawnExplosion(a.position, 0xff4444, 25);
                        scene.remove(a); asteroids.splice(i,1);
                        if(state.lives <= 0) {
                            state.active = false;
                            document.getElementById('game-over-screen').style.display = 'flex';
                            showLeaderboard();
                        }
                    }
                    return;
                }
                bullets.forEach((b, bi) => {
                    if(a && b && a.position.distanceTo(b.position) < a.userData.radius + 0.3) {
                        triggerCombo();
                        state.score += (a.userData.type === 'gold' ? 500 : 100) * Math.max(1, state.combo);
                        document.getElementById('score-val').innerText = state.score.toString().padStart(5, '0');
                        spawnExplosion(a.position, a.userData.type === 'gold' ? 0xffd700 : 0xcccccc);
                        scene.remove(a); asteroids.splice(i,1);
                        scene.remove(b); bullets.splice(bi,1);
                        state.level = Math.floor(state.score/1000) + 1;
                        document.getElementById('lvl-txt').innerText = `LEVEL ${state.level}`;
                    }
                });
                if(a.position.z > 15) { scene.remove(a); asteroids.splice(i,1); }
            });

            particles.forEach((p, i) => {
                p.position.add(p.userData.vel);
                p.userData.life -= 0.025; p.scale.setScalar(p.userData.life);
                if(p.userData.life <= 0) { scene.remove(p); particles.splice(i,1); }
            });

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        update();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
